
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ngodongnguyen
          outputs: |
            dist/github-snake.svg?color_snake=%23ff3399&color_dots=%23ebedf0,%23ffc0df,%23ff80bf,%23e83e8c,%239c27b0
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23ff3399&color_dots=%23161422,%234b234c,%237f296b,%23c92f87,%23ff3399

      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
